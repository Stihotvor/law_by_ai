# Plugin registry (ADR-0001) — protocol → implementation mapping, loaded by
# PluginManager (core/plugins/manager.py) via config.plugins.
#
# DEPRECATED (ADR-0014): the plugin system is being phased out for a one-person
# project. PostgreSQL is now a HARDCODED direct integration
# (plugins.relational_db.postgres.PostgreSQLStore) and no longer routed through
# this registry. No `relational_db` entry may be added here again.
#
# Format:
#   plugins:
#     <type>:            # one of the seven protocol types below
#       <name>:          # arbitrary, ops-facing name
#         module: <python.module.path>   # importable module
#         class: <ClassName>             # class in that module
#         active: true                   # true = serves get_plugin(<type>)
#
# Note: classes are instantiated without arguments today; per-plugin
# `options:` (constructor args) are a future extension.
#
# The examples below are documented, NOT active: the concrete implementations
# in src/plugins/ land in later milestones. Un-commenting an entry whose
# module does not exist yet fails PluginManager.load() validation deliberately.
#
# Exactly one entry per type may be active.

plugins: {}
# Example registrations for the remaining six plugin types — uncommenting an
# entry whose module does not exist yet fails PluginManager.load() validation
# deliberately.
# plugins:
#   vector_db:
#     qdrant:
#       module: plugins.vector_db.qdrant
#       class: QdrantPlugin
#       active: true
#   graph_db:
#     neo4j:
#       module: plugins.graph_db.neo4j
#       class: Neo4jPlugin
#       active: true
#   knowledge_source:
#     web_etl:
#       module: plugins.knowledge_source.web_etl
#       class: WebETLSource
#       active: true
#   embedding:
#     sentence_transformers:
#       module: plugins.embedding.sentence_transformers
#       class: SentenceTransformersPlugin
#       active: true
#   llm:
#     openai:
#       module: plugins.llm.openai_llm
#       class: OpenAILLM
#       active: true
#   reranking:
#     cohere:
#       module: plugins.reranking.cohere_rerank
#       class: CohereReranker
#       active: true
