# Plugin registry (ADR-0001) — protocol → implementation mapping, loaded by
# PluginManager (core/plugins/manager.py) via config.plugins.
#
# Format:
#   plugins:
#     <type>:            # one of the seven protocol types below
#       <name>:          # arbitrary, ops-facing name
#         module: <python.module.path>   # importable module
#         class: <ClassName>             # class in that module
#         active: true                   # true = serves get_plugin(<type>)
#
# Note: classes are instantiated without arguments today; per-plugin
# `options:` (constructor args) are a future extension.
#
# The examples below are documented, NOT active: the concrete implementations
# in src/plugins/ land in later milestones. Un-commenting an entry whose
# module does not exist yet fails PluginManager.load() validation deliberately.
#
# Exactly one entry per type may be active.

plugins: {}
# plugins:
#   relational_db:
#     postgresql:
#       module: plugins.postgresql
#       class: PostgreSQLPlugin
#       active: true
#   vector_db:
#     chroma:
#       module: plugins.chroma
#       class: ChromaPlugin
#       active: true
#   graph_db:
#     memgraph:
#       module: plugins.memgraph
#       class: MemgraphPlugin
#       active: true
#   knowledge_source:
#     web_etl:
#       module: plugins.web_etl
#       class: WebETLSource
#       active: true
#   embedding:
#     sentence_transformers:
#       module: plugins.sentence_transformers
#       class: SentenceTransformersPlugin
#       active: true
#   llm:
#     openai:
#       module: plugins.openai_llm
#       class: OpenAILLM
#       active: true
#   reranking:
#     cohere:
#       module: plugins.cohere_rerank
#       class: CohereReranker
#       active: true