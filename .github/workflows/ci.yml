name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - run: docker compose -f docker/docker-compose.yml up -d --build --wait
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml run --rm test
      - if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml down
