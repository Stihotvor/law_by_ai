name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run unit tests (no external services)
        run: uv run pytest -m "not integration" -q --cov --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Coverage floor for src/agents
        run: uv run coverage report --include='src/agents/*' --fail-under=100
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check mutation target
        run: |
          for d in src/agents/fetch tests/unit/agents/fetch; do
            if [ ! -d "$d" ]; then
              echo "::error::Mutation target $d is missing; the gate must not pass vacuously."
              exit 1
            fi
          done
      - name: Run mutation tests (scope set in pyproject.toml)
        run: uv run mutmut run
      - name: Summarise results
        if: always()
        run: uv run mutmut results > mutation-summary.txt
      - name: Enforce mutation score (threshold in scripts/mutation_score.py)
        run: uv run python scripts/mutation_score.py
      - name: Upload mutation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-summary
          path: mutation-summary.txt
          if-no-files-found: warn
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run pyright
        run: uv run pyright

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ scripts/ -c pyproject.toml
      - name: pip-audit dependency vulnerabilities
        run: uv run pip-audit

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-test, typecheck, security]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Materialize .env from template
        run: cp docker/.env.example docker/.env
      # init refuses `change-me` secrets, and the smoke worker needs init.
      - name: Replace placeholder secrets
        run: sed -i "s/=change-me.*/=$(openssl rand -hex 16)/" docker/.env
      - name: Validate compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image (with GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: law-by-ai:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      # `run --rm test` starts only postgres+redis and runs the full test suite
      # against the live stack. The app is not started; prod stack boot is
      # verified manually.
      - name: Run tests against live postgres/redis
        run: docker compose --profile test -f docker/docker-compose.yml run --rm test
      # Smoke: the worker (with a mocked Sejm API) consumes a queued fetch task.
      # Tags match the Compose image names, so `up` does not rebuild them.
      - name: Build runtime image (with GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: |
            law-by-ai-smoke-init
            law-by-ai-smoke-celery-worker
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Start the smoke worker
        run: docker compose -p law-by-ai-smoke --profile test -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml up -d --wait celery-worker
      - name: Run the fetch smoke test
        run: docker compose -p law-by-ai-smoke --profile test -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml run --rm -e SMOKE_WORKER=1 test pytest -q -p no:cacheprovider tests/smoke
      - name: Tear down the stack
        if: always()
        run: docker compose -p law-by-ai-smoke --profile test -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml down -v
