name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run unit tests (no external services)
        run: uv run pytest -m "not integration" -q --cov --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Coverage floor for src/agents
        run: uv run coverage report --include='src/agents/*' --fail-under=100
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check mutation target
        run: |
          for d in src/agents/fetch tests/unit/agents/fetch; do
            if [ ! -d "$d" ]; then
              echo "::error::Mutation target $d is missing; the gate must not pass vacuously."
              exit 1
            fi
          done
      - name: Run mutation tests (scope set in pyproject.toml)
        run: uv run mutmut run
      - name: Summarise results
        if: always()
        run: uv run mutmut results > mutation-summary.txt
      - name: Enforce mutation score (threshold in scripts/mutation_score.py)
        run: uv run python scripts/mutation_score.py
      - name: Upload mutation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-summary
          path: mutation-summary.txt
          if-no-files-found: warn
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run pyright
        run: uv run pyright

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ scripts/ -c pyproject.toml
      - name: pip-audit dependency vulnerabilities
        run: uv run pip-audit

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-test, typecheck, security]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Materialize .env from template
        run: cp docker/.env.example docker/.env
      - name: Validate compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test image (with GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: law-by-ai:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      # No `up --wait` here: prod stack boot is verified manually. `run --rm
      # test` starts only postgres+redis and runs the full test suite against
      # the live stack — never app/worker (keeps CI lean).
      - name: Run tests against live postgres/redis
        run: docker compose --profile test -f docker/docker-compose.yml run --rm test
      - name: Tear down the stack
        if: always()
        run: docker compose --profile test -f docker/docker-compose.yml down -v
