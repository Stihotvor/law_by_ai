name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run unit tests (no external services)
        run: uv run pytest -m "not integration" -q --cov=core --cov=plugins

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image (with GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: law-by-ai:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      # No `up --wait` here: prod stack boot is verified manually. `run --rm
      # test` starts only postgres+redis and runs the full test suite against
      # the live stack — never app/worker (keeps CI lean).
      - name: Run tests against live postgres/redis
        run: docker compose --profile test -f docker/docker-compose.yml run --rm --no-build test
      - name: Tear down the stack
        if: always()
        run: docker compose --profile test -f docker/docker-compose.yml down -v
