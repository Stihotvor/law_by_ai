name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Build and start the stack
        run: docker compose -f docker/docker-compose.yml up -d --build --wait
      - name: Run tests in-container against the live stack
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml run --rm test
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml down
