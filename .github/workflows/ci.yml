name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run unit tests (no external services)
        run: uv run pytest -m "not integration" -q --cov --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check mutation target
        id: target
        run: |
          if [ -d src/agents/fetch ] && [ -d tests/unit/agents/fetch ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Mutation target src/agents/fetch not present; skipping."
          fi
      - name: Run mutation tests (scope set in pyproject.toml)
        if: steps.target.outputs.present == 'true'
        run: uv run mutmut run
      - name: Summarise results
        if: always() && steps.target.outputs.present == 'true'
        run: uv run mutmut results > mutation-summary.txt
      - name: Upload mutation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-summary
          path: mutation-summary.txt
          if-no-files-found: warn
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run pyright
        run: uv run pyright

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml
      - name: pip-audit dependency vulnerabilities
        run: uv run pip-audit

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, unit-test, typecheck, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Materialize .env from template
        run: cp docker/.env.example docker/.env
      - name: Validate compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image (with GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: law-by-ai:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      # No `up --wait` here: prod stack boot is verified manually. `run --rm
      # test` starts only postgres+redis and runs the full test suite against
      # the live stack — never app/worker (keeps CI lean).
      - name: Run tests against live postgres/redis
        run: docker compose --profile test -f docker/docker-compose.yml run --rm test
      - name: Tear down the stack
        if: always()
        run: docker compose --profile test -f docker/docker-compose.yml down -v
