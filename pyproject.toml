[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law-by-ai"
version = "0.1.0"
description = "AI-powered legal document ingestion, processing, retrieval, and analysis platform."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yevhen D." }]
dependencies = [
    "celery[redis]>=5.4",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "plugins*", "agents*", "tasks*", "ui*", "data*", "config*", "storage*"]
exclude = ["docs*", "site*", "tests*", "scripts*", "evals*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests that need external services",
    "security: auth, RBAC, and tenant isolation tests",
]

[tool.bandit]
exclude_dirs = ["tests", "docs", "scripts", "evals"]
