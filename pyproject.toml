[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law-by-ai"
version = "0.1.0"
description = "AI-powered legal document ingestion, processing, retrieval, and analysis platform."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yevhen D." }]
dependencies = [
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "httpx==0.28.1",
    "minio==7.2.20",
    "psycopg[binary]>=3.1",
    "pydantic==2.14.2",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "streamlit-authenticator>=0.4.2",
    "tavily-python==0.8.5",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "freezegun>=1.5",
    "diff-cover==11.0.0",
    "mutmut==3.8.1",
]
docs = [
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "plugins*", "agents*", "tasks*", "ui*", "data*", "config*", "storage*"]
exclude = ["docs*", "site*", "tests*", "scripts*", "evals*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/seed_db.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests that need external services",
    "security: auth, RBAC, and tenant isolation tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 66
show_missing = true

[tool.mutmut]
# Scope: the document fetcher package. To change it, edit source_paths and
# pytest_add_cli_args_test_selection here (mutmut 3.8.1 reads scope only from this file).
source_paths = ["src/agents/fetch/"]
pytest_add_cli_args_test_selection = ["tests/unit/agents/fetch/"]
also_copy = ["src/"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "scripts", "evals"]

[dependency-groups]
dev = [
    "alembic>=1.19.1",
]
