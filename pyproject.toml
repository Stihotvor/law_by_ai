[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "law-by-ai"
version = "0.1.0"
description = "AI-powered legal document ingestion, processing, retrieval, and analysis platform."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yevhen D." }]
dependencies = [
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "celery[redis]==5.6.3",
    "httpx==0.28.1",
    "mako==1.4.3",  # transitive via alembic; pinned for the CVE fix
    "minio==7.2.20",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "redis==6.4.0",
    "sqlalchemy==2.1.6",
    "streamlit==1.66.1",
    "streamlit-authenticator==0.4.2",
    "tavily-python==0.8.5",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "freezegun==1.5.5",
    "diff-cover==11.0.0",
    "mutmut==3.8.1",
    "types-PyYAML==6.0.12.20250915",
]
docs = [
    "mkdocs-material==9.8.0",
    "pymdown-extensions==12.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "plugins*", "agents*", "tasks*", "ui*", "data*", "config*", "storage*", "bootstrap*"]
exclude = ["docs*", "site*", "tests*", "scripts*", "evals*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "PT", "RET", "PTH", "PERF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests that need external services",
    "security: auth, RBAC, and tenant isolation tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 88
show_missing = true

[tool.mutmut]
# Scope: the document fetcher package. To change it, edit source_paths and
# pytest_add_cli_args_test_selection here (mutmut 3.8.1 reads scope only from this file).
source_paths = ["src/agents/fetch/"]
pytest_add_cli_args_test_selection = ["tests/unit/agents/fetch/"]
also_copy = ["src/"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
