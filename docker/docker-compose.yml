name: law-by-ai

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawbyai} -d ${POSTGRES_DB:-lawbyai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [internal]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    command:
      - streamlit
      - run
      - src/ui/app.py
      - --server.port=${APP_PORT:-8501}
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "${APP_PORT:-8501}:${APP_PORT:-8501}"
    env_file: .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8501}/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    command:
      - celery
      - -A
      - tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # Test runner — only built/started with `--profile test`. Keeps prod lean:
  # `docker compose up` never builds the test image; the `test` build target
  # is the sole source of dev extras (pytest, etc.).
  test:
    image: law-by-ai:test
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    profiles: ["test"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    command: ["pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge