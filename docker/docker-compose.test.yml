name: law-by-ai

# CI test override: adds a `test` service built from the `test` Docker
# target (runtime deps + dev extras, e.g. pytest). Run against the same
# stack defined in docker-compose.yml:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml \
#       up -d --wait
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml \
#       run --rm test
#
# Only the `test` service here installs dev dependencies; the production
# services (app, celery-worker) always build the lean `runtime` target.
services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lawbyai}:${POSTGRES_PASSWORD:-lawbyai}@postgres:5432/${POSTGRES_DB:-lawbyai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    command: ["pytest", "-m", "not integration", "-q", "-p", "no:cacheprovider"]
